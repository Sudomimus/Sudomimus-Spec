openapi: 3.1.0
info:
  title: Sudomimus Session
  version: 4.0.0
  summary: Application session lifecycle API.
  description: |
    The Session API owns ordinary Sudomimus ApplicationSession refresh
    rotation after an initial flow has issued application credentials.
    Connect, device-api, and native-api can all create logical sessions;
    callers use this API to rotate credentials, introspect live session
    authority, logout, or revoke those sessions. The API also publishes each
    application's token-signing JWK Set so relying applications can verify
    access and refresh tokens without a dependency on Connect.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://session-api.sudomimus.com
    description: Production
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Report Session invocation health and deployment identity.
      responses:
        "200":
          description: |
            The API invocation path is operational and reports the deployed
            service identity. This response does not assert dependency,
            configuration, or business-capability readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /applications/{applicationAnchor}/jwks.json:
    get:
      operationId: applicationJwks
      summary: Fetch the public signing keys for one application's tokens.
      description: |
        Returns the lifecycle-aware public JWK Set used to verify ordinary
        application access and refresh tokens. Select the key whose `kid`
        matches the JWT JOSE header. The set can contain PREPUBLISHED, ACTIVE,
        and still-published RETIRING keys; it never contains private key
        material or REVOKED keys. The set contains at most 32 keys.
      parameters:
        - name: applicationAnchor
          in: path
          required: true
          description: Stable public application identifier carried by token `aud`.
          schema:
            type: string
      responses:
        "200":
          description: Public JWK Set for the application.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicJwksCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationJwksResponse"
        "400":
          description: The required application anchor path parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reason `ApplicationNotFound` — the application anchor is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access token.
      description: |
        Issues a new access token AND a new refresh token by conditionally
        advancing the same ApplicationSession's signed `rotationVersion`.
        The Session API implements
        OAuth 2.1 BCP §4.14.2 strict refresh-token rotation: every successful
        `/refresh` rotates the refresh token, and a later presentation of the
        previous signed version is treated as evidence of compromise unless it is a
        near-simultaneous retry inside the rotation grace window.

        Inside that short grace window, if another request already advanced
        the same session by exactly one version and that winning state remains
        active, the retry deterministically reissues the exact winning refresh
        JWT and receives HTTP 200. Outside the grace window, for a version older
        than the immediately previous version, or when exact adoption cannot be
        proven, the ApplicationSession is terminally revoked and the caller must restart with
        its initial login flow: Connect inquiry, device authorization, native
        direct-issue, or another ordinary application-token issuance path.

        This endpoint accepts only ApplicationSessions whose required issuance
        protocol is `APPLICATION`. OIDC sessions are
        rejected before account, authority, grace-adoption, or rotation work
        and must use the OIDC `/token` endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: |
            New access token and rotated refresh token issued. A benign
            concurrent retry may also receive 200 by adopting the exact signed
            version created by the winning refresh inside the rotation grace window.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: Reason `AccountNotFound` — the account behind the refresh token could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Refresh token rejected. The `reason` distinguishes:

            - `RefreshTokenInvalid` — the JWT is malformed, has an unsupported
              algorithm or issuer, lacks required claims, names an unknown
              application, or does not exactly bind to a stored ApplicationSession.
            - `RefreshTokenInvalidType` — the JWT is not a refresh token, or
              the stored session belongs to the OIDC issuance protocol.
            - `RefreshTokenInvalidSignature` — signature verification failed.
            - `RefreshTokenSuspended` — the ApplicationSession is suspended.
            - `RefreshTokenExpired` — the token is past its `exp`.
            - `RefreshTokenRevoked` — the ApplicationSession or one of its live
              authority bindings was revoked.
            - `RefreshTokenFamilyCompromised` — the signed version is stale and
              exact grace-window adoption did not apply; the ApplicationSession
              has now been terminally revoked.

            A concurrent rotation race that cannot adopt the winning version also
            returns HTTP 401 and revokes the session, but intentionally carries
            an empty response body rather than exposing a public reason.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The attempt was refused. The `reason` distinguishes:

            - `AccountDisabled` — the account behind the refresh token is disabled.
            - `AccountDeleted` — the account has been erased.
            - `ApplicationNotActive` — the application, parent sector, or parent organization no longer permits token issuance.
            - `ClaimConsentRequired` — a REQUIRED claim is no longer satisfied by a standing grant.
            - `RequiredClaimDataMissing` — the REQUIRED email claim is granted,
              but the account no longer owns a primary email address to issue.
            - `EmailDomainBlocked` — a verified adopted domain now blocks this account.
            - `EmailDomainRequiresSso` — a verified adopted domain now requires SSO and this session was not realized through the required connector.
            - `SsoAuthorityConflict` — verified adopted domains require distinct SSO connectors, so no refresh session can satisfy every domain authority until the conflict is repaired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `AuthorizationArtifactStale` — the email-identity or exact sector
            binding changed after refresh authorization was evaluated. Restart
            through an initial issuance flow so current identity and claim
            authority are evaluated before another ApplicationSession is used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /introspect:
    post:
      operationId: introspect
      summary: Check whether the session behind an access token is still valid.
      description: |
        Strongly resolves the supplied access token's payload `sid` and returns
        the current effective status of that ApplicationSession. The token's
        `aud` and pairwise payload `sub` must exactly match the stored session.
        The access token is
        self-authenticating: its signature is verified against the issuing
        application's public key, so no client-auth JWT is required. The access
        token's own expiry is not enforced here; the answer describes the
        underlying session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntrospectRequest"
      responses:
        "200":
          description: Status of the session behind the access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectResponse"
        "401":
          description: Access token missing, malformed, or with an invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /userinfo:
    get:
      operationId: userinfo
      summary: Resolve current identity data shared with an application.
      description: |
        Accepts an ordinary application access token as a Bearer credential and
        returns current, consent-gated identity data for its live
        ApplicationSession. This endpoint accepts only sessions whose issuance
        protocol is `APPLICATION`; OIDC clients use the discovered OIDC
        `userinfo_endpoint` instead. Profile data is read live and is never
        copied from the access token.
      security:
        - BearerAccessToken: []
      responses:
        "200":
          description: Current application-visible identity data.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
            Vary:
              description: Prevent shared-cache reuse across Bearer credentials.
              schema:
                type: string
                enum: [Authorization]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          description: Bearer token missing, malformed, expired, inactive, or owned by another issuance protocol.
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BearerError"
  /claim-state:
    get:
      operationId: claimState
      summary: Resolve current identity-claim policy and consent state.
      description: |
        Accepts an ordinary application access token as a Bearer credential and
        returns the live policy requirement and standing consent state for each
        shareable UserInfo claim. This endpoint accepts only sessions whose
        issuance protocol is `APPLICATION`; OIDC clients use the custom
        `claim_state_endpoint` from OIDC discovery instead.
      security:
        - BearerAccessToken: []
      responses:
        "200":
          description: Current application-visible claim state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
            Vary:
              description: Prevent shared-cache reuse across Bearer credentials.
              schema:
                type: string
                enum: [Authorization]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStateResponse"
        "401":
          description: Bearer token missing, malformed, expired, inactive, or owned by another issuance protocol.
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BearerError"
  /logout:
    post:
      operationId: logout
      summary: Revoke the session behind a refresh token.
      description: |
        Revokes the single session identified by the supplied refresh token.
        Any genuine signed version whose `sid`, `aud`, `jti`, and
        `rotationVersion` bind to that session may authorize the revocation;
        accepting an older genuine version here does not make it refreshable.
        No client-auth JWT is required. The operation is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /revoke-all:
    post:
      operationId: revokeAll
      summary: Revoke every session of an account for the calling application.
      description: |
        Advances the account/application revocation authority for the account
        identified by the supplied sector subject, then best-effort revokes
        currently enumerated application-session rows. This is an
        application-authority action, so it requires a client-auth JWT with audience
        `sudomimus-session`. Revocation is scoped to the calling application;
        sessions of the same account under other applications are unaffected.
        A successful response acknowledges the request with `revoked: true`.
        Unknown or out-of-sector subjects return the same acknowledgement to
        avoid an existence oracle. Cleanup results are never exposed publicly.
        Client authentication is evaluated against the raw request body before
        recursive request-body schema validation. Each signed request is
        at-most-once: its `jti` is consumed in a `/revoke-all`-specific replay
        namespace, and a transport retry must use a freshly signed client JWT.
      security:
        - SudomimusClientJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllRequest"
      responses:
        "200":
          description: Authority-safe revocation acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllResponse"
        "401":
          description: |
            Client-auth JWT missing, malformed, expired, invalid, or replayed.
            A retry after an uncertain response must use a freshly signed JWT
            with a new `jti`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    PublicJwksCacheControl:
      description: Public cache lifetime bounded by the signing-key prepublication window.
      schema:
        type: string
        pattern: ^public, max-age=[0-9]+$
    CredentialCacheControl:
      description: Prevent storage of the credential-bearing response.
      schema:
        type: string
        enum: [no-store]
    CredentialPragma:
      description: Legacy cache instruction retained for credential responses.
      schema:
        type: string
        enum: [no-cache]
  securitySchemes:
    BearerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ordinary Sudomimus application access token.
    SudomimusClientJWT:
      type: http
      scheme: SudomimusClientJWT
      description: |
        Client-auth JWT carried via `Authorization: SudomimusClientJWT <jwt>`.
        For Session API `/revoke-all`, the `aud` claim MUST be the literal
        string `"sudomimus-session"`. The JWT is RS256-signed with the
        application's client-auth private key and carries `iss`, `iat`, `exp`,
        `jti`, and `body_sha256` exactly like Connect `/establish`. The `jti` is
        one-time within the `/revoke-all` replay namespace.
  schemas:
    ApplicationJsonWebKey:
      type: object
      additionalProperties: false
      required: [kty, n, e, kid, use, alg]
      properties:
        kty:
          type: string
          enum: [RSA]
        n:
          type: string
          description: Base64url-encoded RSA modulus.
        e:
          type: string
          description: Base64url-encoded RSA public exponent.
        kid:
          type: string
          description: Stable signing-key identifier copied into JWT JOSE headers.
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [RS256]
    ApplicationJwksResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ApplicationJsonWebKey"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: The API invocation path completed successfully.
        service:
          type: string
          description: Stable runtime service identity.
        version:
          type: string
          description: Version from the deployed service's version manifest.
    ClaimRequirementStateView:
      type: object
      required: [requirement, state]
      properties:
        requirement:
          type: string
          enum: [SYNTHETIC_ONLY, OFF, OPTIONAL, REQUIRED, SYNTHETIC_FALLBACK]
        state:
          type: string
          enum: [UNKNOWN, GRANTED, DENIED]
    ClaimsStateView:
      type: object
      required: [email, firstName, lastName, staticAvatar, animatedAvatar]
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        firstName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        lastName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        staticAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        animatedAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Signed refresh credential carrying stable payload `sid`, exact version `jti`, and `rotationVersion`; it contains no user identifier.
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken, claims]
      properties:
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        accessToken:
          type: string
          description: Newly issued short-lived access token JWT carrying payload `sid` and pairwise `sub` with a fresh `jti`.
        refreshToken:
          type: string
          description: Newly issued refresh token JWT for the same payload `sid`, with a fresh `jti` and incremented `rotationVersion`; the presented version has been consumed.
    IntrospectRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Signed access credential whose payload `sid` is strongly resolved; its own `exp` is intentionally ignored by introspection.
    UserInfoResponse:
      type: object
      additionalProperties: false
      required: [sub]
      properties:
        sub:
          type: string
          minLength: 1
          description: Pairwise sector subject for this application.
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        picture:
          type: string
          format: uri
        picture_animated:
          type: string
          format: uri
          description: Sudomimus private claim for the sector-scoped animated avatar URL.
    UserInfoClaimStateView:
      type: object
      additionalProperties: false
      required: [email, given_name, family_name, picture, picture_animated]
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        given_name:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        family_name:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        picture:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        picture_animated:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    ClaimStateResponse:
      type: object
      additionalProperties: false
      required: [sub, claims]
      properties:
        sub:
          type: string
          minLength: 1
          description: Pairwise sector subject for this application.
        claims:
          $ref: "#/components/schemas/UserInfoClaimStateView"
    BearerError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_token]
    IntrospectResponse:
      type: object
      required: [status, recommendedRecheckSeconds]
      properties:
        status:
          type: string
          enum: [active, revoked, expired, not_found]
        recommendedRecheckSeconds:
          type: integer
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Any genuine signed refresh-token version for the ApplicationSession to revoke.
    LogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    RevokeAllRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          description: Application-visible sector subject (`sub`) for the account to revoke.
    RevokeAllResponse:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: Authority-safe acknowledgement of the revocation request.
    Error:
      type: object
      description: |
        Error response body. A missing, malformed, or structurally invalid JSON
        request body returns `InvalidBody` without parser or
        validation-library detail. A documented status-only private failure has
        an empty response body instead.
      required: [reason]
      properties:
        reason:
          type: string
        message:
          type: string

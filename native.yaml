openapi: 3.1.0
info:
  title: Sudomimus Native
  version: 4.0.0
  summary: Native client entry point for the Sudomimus authentication platform.
  description: |
    Native clients exchange a Steam Web API ticket, an application-scoped
    access key, or a signed Ed25519 public-key assertion for Sudomimus
    application tokens. Direct issuance completes in one request without a
    browser handoff or inquiry polling.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://native-api.sudomimus.com
    description: Production
# No global HTTP-level auth. Steam and AccessKey direct issue authenticate with
# request-body credentials; public-key direct issue uses its operation-level
# signed-assertion Authorization scheme.
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Report Native invocation health and deployment identity.
      responses:
        "200":
          description: |
            The API invocation path is operational and reports the deployed
            service identity. This response does not assert dependency,
            configuration, or business-capability readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /direct-issue/access-key:
    post:
      operationId: directIssueAccessKey
      summary: Exchange an access-key credential for application tokens.
      description: |
        Exchanges an application-scoped access-key identifier and secret for
        access and refresh tokens. The key must belong to the named
        application, remain active, and satisfy its configured authorization
        rules. Credential rejection uses the single opaque reason
        `AccessKeyDirectDenied`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectIssueAccessKeyRequest"
      responses:
        "200":
          description: Tokens issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueAccessKeyResponse"
        "400":
          description: |
            Malformed request body. The `reason` distinguishes
            `InvalidAccessKeyIdentifier` (must use the canonical
            `acs_k_<UUID v4>` form) and `InvalidAccessKeySecret` (must use
            the canonical `acs_t_<64 lowercase hex chars>` form).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Reason `AccessKeyDirectDenied`: the access-key credential was
            rejected. Obtain a current credential before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The attempt was refused. The response `reason` distinguishes:

            - `Layer1Denied`, `Layer2Denied`, `Layer3Denied` — application
              policy rejected the attempt.
            - `ApplicationNotActive` — the application is unavailable.
            - `AccountDisabled` or `AccountDeleted` — the account is
              unavailable for issuance.
            - `EmailDomainBlocked`, `EmailDomainRequiresSso`, or
              `SsoAuthorityConflict` — email-domain policy prevents issuance.
            - `ClaimConsentRequired` or `RequiredClaimDataMissing` — browser
              interaction is required before direct issuance can continue.

            Claim-gate responses also include `claims` and an `errand` browser
            handoff. Open `errand.url`, wait or poll its status, then retry this
            request once after completion.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueDeniedError"
        "404":
          description: Application anchor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Reason `AuthorizationArtifactStale`: identity authority changed
            during the attempt. Retry the complete credential exchange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many access-key attempts. Back off before retrying.
        "500":
          description: Access-key issuance failed with an empty response body.
        "503":
          description: Access-key issuance is temporarily unavailable.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /direct-issue/public-key:
    post:
      operationId: directIssuePublicKey
      summary: Exchange an Ed25519 public-key assertion for application tokens.
      description: |
        Authenticates an Account or one of its Agent/Automation principals with
        a compact JWT signed by a registered Ed25519 key. The credential's
        immutable Application/Sector applicability must include the named
        application. Account credentials issue ordinary application access
        tokens; Workload credentials issue the dedicated Workload access-token
        type with pairwise `act.sub`. Credential rejection uses the single
        opaque reason `PublicKeyDirectDenied`.

        The JOSE header must be exact `{alg:"EdDSA",
        typ:"vnd.sudomimus.public-key-assertion+jwt",kid:"pky_..."}`. Claims
        must be exact `iss`, `aud`, `iat`, `exp`, `jti`, and `requestHash`;
        `iss` equals `kid`, `aud` is `sudomimus-native-public-key`, lifetime is
        at most 60 seconds, and `requestHash` is base64url SHA-256 of the exact
        request-body bytes. Every retry uses a new random 128-bit `jti`.
      security:
        - PublicKeyAssertion: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectIssuePublicKeyRequest"
      responses:
        "200":
          description: Tokens issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueAccessKeyResponse"
        "400":
          description: Malformed request body or public-key assertion syntax.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Reason `PublicKeyDirectDenied`: the credential or signed assertion
            was rejected without revealing whether the key exists or which
            principal owns it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Application rule, Account lifecycle, email-domain policy, or claim
            requirements refused issuance. Claim-gate responses use the same
            `claims` and `errand` handoff as AccessKey issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueDeniedError"
        "404":
          description: Application anchor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            The assertion `jti` was already seen, or identity authority changed
            during issuance. Sign a fresh assertion and retry the complete
            exchange.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many public-key attempts. Back off before retrying.
        "500":
          description: Public-key issuance failed with an empty response body.
        "503":
          description: Public-key issuance is temporarily unavailable.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /direct-issue/steam-ticket:
    post:
      operationId: directIssueSteamTicket
      summary: Exchange a Steam Web API auth ticket for application tokens.
      description: |
        The client SDK calls `ISteamUser::GetAuthTicketForWebApi("sudomimus")`
        (the identity string MUST be exactly `"sudomimus"`), waits for the
        `GetTicketForWebApiResponse_t` callback, hex-encodes the returned bytes,
        and submits them with the application anchor and Steam App ID. The
        ticket must satisfy the application's configured rules and is
        single-use for this exchange. Verify the returned tokens through the
        application's Session JWKS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectIssueSteamTicketRequest"
      responses:
        "200":
          description: Tokens issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueSteamTicketResponse"
        "400":
          description: Malformed request (e.g. invalid `steamAppId`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Steam rejected the ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The attempt was refused. The response `reason` distinguishes:

            - `Layer1Denied`, `Layer2Denied`, `Layer3Denied` — application
              policy rejected the attempt.
            - `ApplicationNotActive` — the application is unavailable.
            - `AccountDisabled` or `AccountDeleted` — the account is
              unavailable for issuance.
            - `EmailDomainBlocked`, `EmailDomainRequiresSso`, or
              `SsoAuthorityConflict` — email-domain policy prevents issuance.
            - `ClaimConsentRequired` or `RequiredClaimDataMissing` — browser
              interaction is required before direct issuance can continue.

            Claim-gate responses also include `claims` and an `errand` browser
            handoff. Open `errand.url`, wait or poll its status, then acquire a
            fresh Steam ticket and retry once after completion.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectIssueDeniedError"
        "404":
          description: Application anchor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Conflict. The response `reason` distinguishes:

            - `ReplayProtectionAlreadySeen` — the ticket was already submitted
              or is being processed.
            - `AuthorizationArtifactStale` — identity authority changed during
              the attempt.

            Acquire a fresh ticket before retrying either condition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: |
            Too many Steam-ticket attempts. Back off before acquiring and
            submitting another ticket.
        "502":
          description: Steam ticket verification is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /errand:
    post:
      operationId: createErrand
      summary: Proactively mint an errand for a user you already authenticated.
      description: |
        Creates a browser handoff that lets an already authenticated user
        complete profile data or manage optional claim sharing. Supply a
        current application access token. The browser flow re-authenticates the
        user before making changes. If nothing is required, `errand` is `null`;
        otherwise open `errand.url` and optionally poll its status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateErrandRequest"
      responses:
        "200":
          description: |
            Either the errand handoff to open, or `errand: null` when nothing is
            owed. `claims` always reports the per-claim state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateErrandResponse"
        "401":
          description: The access token is missing, malformed, expired, or no longer active.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: The application or the account is disabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /errand/{errandKey}/status:
    get:
      operationId: errandStatus
      summary: Poll the status of an errand handoff.
      description: |
        Poll about every two seconds while the user completes the browser
        handoff, or wait for confirmation in your own UI. No additional
        authentication is required beyond `errandKey`. Unknown, malformed, and
        expired keys all report `EXPIRED`. After `COMPLETED`, retry the original
        direct-issue request once.
      parameters:
        - name: errandKey
          in: path
          required: true
          schema:
            type: string
          description: The `errand.errandKey` value from the 403 body.
      responses:
        "200":
          description: Current errand status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrandStatusResponse"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  securitySchemes:
    PublicKeyAssertion:
      type: apiKey
      in: header
      name: Authorization
      description: '`SudomimusPublicKeyJWT <compact signed assertion>`.'
  headers:
    CredentialCacheControl:
      description: Prevent storage of the credential-bearing response.
      schema:
        type: string
        enum: [no-store]
    CredentialPragma:
      description: Legacy cache instruction retained for credential responses.
      schema:
        type: string
        enum: [no-cache]
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum: [ok]
          description: The API invocation path completed successfully.
        service:
          type: string
          description: Stable runtime service identity.
        version:
          type: string
          description: Version from the deployed service's version manifest.
    DirectIssueAccessKeyRequest:
      type: object
      additionalProperties: false
      required:
        - applicationAnchor
        - accessKeyIdentifier
        - accessKeySecret
      properties:
        applicationAnchor:
          type: string
          description: Public anchor identifying the integrating application.
        accessKeyIdentifier:
          type: string
          pattern: "^acs_k_[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-4[0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
          description: |
            Canonical access-key identifier, including the mandatory
            `acs_k_` prefix followed by its UUID.
        accessKeySecret:
          type: string
          pattern: "^acs_t_[0-9a-f]{64}$"
          description: |
            Canonical access-key secret, including the mandatory `acs_t_`
            prefix followed by 64 lowercase hexadecimal characters (32
            random bytes). Returned only when the access key is issued.
    DirectIssuePublicKeyRequest:
      type: object
      additionalProperties: false
      required:
        - applicationAnchor
      properties:
        applicationAnchor:
          type: string
          description: Public anchor identifying the integrating application.
    DirectIssueAccessKeyResponse:
      type: object
      required:
        - applicationAnchor
        - accessToken
        - refreshToken
        - claims
      properties:
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        applicationAnchor:
          type: string
        accessToken:
          type: string
          description: |
            Account credentials use media type
            `vnd.sudomimus.application-access+jwt`. Workload credentials use
            `vnd.sudomimus.workload-access+jwt` and add exact
            `act: {sub: <pairwise-workload-subject>}`. In both cases payload
            `sub` is the owner Account's pairwise sector subject, `sid`
            identifies the session, and `jti` identifies this token instance.
            The token contains no profile claims or raw Account/Workload
            identifier; use Session API `/userinfo` for current shared data.
        refreshToken:
          type: string
          description: Long-lived refresh token JWT with stable payload `sid`, version identifier `jti`, and positive `rotationVersion`. It contains no user identifier. Use Session API `/refresh` for renewal without re-presenting the access key.
    DirectIssueSteamTicketRequest:
      type: object
      additionalProperties: false
      required:
        - applicationAnchor
        - steamTicketHex
        - steamAppId
      properties:
        applicationAnchor:
          type: string
          description: Public anchor identifying the integrating application.
        steamTicketHex:
          type: string
          description: |
            Hex-encoded Steam Web API auth ticket bytes returned from
            `ISteamUser::GetAuthTicketForWebApi("sudomimus")`. Hexadecimal
            characters are case-insensitive.
        steamAppId:
          type: integer
          format: int64
          minimum: 1
          description: |
            Steam App ID under which the ticket was generated. Must be
            allow-listed by the application's `STEAM_TICKET` authentication
            rule. Steam binds tickets to their issuing App ID; passing a
            different value fails verification.
    DirectIssueSteamTicketResponse:
      type: object
      required:
        - applicationAnchor
        - accessToken
        - refreshToken
        - claims
      properties:
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        applicationAnchor:
          type: string
        accessToken:
          type: string
          description: |
            Short-lived access token (JWT). Payload `sub` is the pairwise
            sector subject, `sid` identifies the session, and
            `jti` identifies this token instance. It contains no profile claims
            or raw account identifier; use Session API `/userinfo` for current
            shared identity data.
        refreshToken:
          type: string
          description: Long-lived refresh token JWT with stable payload `sid`, version identifier `jti`, and positive `rotationVersion`. It contains no user identifier. Use Session API `/refresh` to obtain a new access token without re-acquiring a Steam ticket.
    ClaimRequirementStateView:
      type: object
      description: |
        One shareable claim: what the application requests (`requirement`)
        joined with the user's standing decision (`state`). `UNKNOWN` means
        the user was never asked; `DENIED` means the user explicitly
        declined.
      required:
        - requirement
        - state
      properties:
        requirement:
          type: string
          description: |
            The developer's policy for the claim. `SYNTHETIC_ONLY` always
            emits the generated placeholder and never asks for real data.
            `SYNTHETIC_FALLBACK` guarantees the claim is present but uses a
            generated placeholder (a stand-in name, a proxy email, or a
            generated avatar) when the user has not shared real data. Unlike `REQUIRED`, neither
            synthetic mode blocks issuance or raises an errand.
          enum: [SYNTHETIC_ONLY, OFF, OPTIONAL, REQUIRED, SYNTHETIC_FALLBACK]
        state:
          type: string
          enum: [UNKNOWN, GRANTED, DENIED]
    ClaimsStateView:
      type: object
      description: |
        Per-claim view across the five shareable claims, carried on both
        the 200 (why is a claim absent from the minted token) and the
        claim-gate 403 (what is still owed).
      required:
        - email
        - firstName
        - lastName
        - staticAvatar
        - animatedAvatar
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        firstName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        lastName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        staticAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        animatedAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    ErrandHandoff:
      type: object
      description: |
        The browser side-trip that unblocks a claim-gated direct-issue:
        a short-lived, single-use bearer URL where the user authenticates when
        required, completes missing data, and manages consent. Open the URL and
        let the browser page guide the user.
      required:
        - errandKey
        - url
        - expiresAt
      properties:
        errandKey:
          type: string
          description: Bearer key (`ernd_…`); also the status-poll path key.
        url:
          type: string
          format: uri
          description: Open this in the user's system browser.
        expiresAt:
          type: string
          format: date-time
    DirectIssueDeniedError:
      type: object
      description: |
        403 body. For the claim-gate reasons (`ClaimConsentRequired`,
        `RequiredClaimDataMissing`) the `claims` view and the `errand`
        handoff are present; for every other reason only `reason` is set.
      required:
        - reason
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code.
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        errand:
          $ref: "#/components/schemas/ErrandHandoff"
    CreateErrandRequest:
      type: object
      additionalProperties: false
      required:
        - accessToken
      properties:
        accessToken:
          type: string
          description: |
            A current application access token (JWT) for the user. The token
            must be unexpired and its session must remain active.
    CreateErrandResponse:
      type: object
      required:
        - errand
        - claims
      properties:
        errand:
          description: |
            The browser side-trip to open, or `null` when the account already
            satisfies the application's claim policy (nothing to consent to or
            complete) — in that case just direct-issue.
          oneOf:
            - $ref: "#/components/schemas/ErrandHandoff"
            - type: "null"
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
    ErrandStatusResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [PENDING, COMPLETED, EXPIRED]
    Error:
      type: object
      description: |
        Error response body. Known failures may include a stable `reason`.
        Some failures are status-only and have an empty body. A missing,
        malformed, or structurally invalid JSON body returns `InvalidBody`.
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code.

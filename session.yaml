openapi: 3.1.0
info:
  title: Sudomimus Session
  version: 4.0.0
  summary: Application session lifecycle API.
  description: |
    Use the Session API to verify application tokens, rotate refresh tokens,
    inspect live session authority, retrieve current shared identity data, and
    revoke sessions created through Connect, Device, or Native flows. It
    accepts ordinary application access tokens and dedicated Workload access
    tokens carrying pairwise `act.sub`; both resolve to the owner Account's
    existing claim-sharing authority.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://session-api.sudomimus.com
    description: Production
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Report Session invocation health and deployment identity.
      responses:
        "200":
          description: |
            The API invocation path is operational and reports the deployed
            service identity. This response does not assert dependency,
            configuration, or business-capability readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /applications/{applicationAnchor}/jwks.json:
    get:
      operationId: applicationJwks
      summary: Fetch the public signing keys for one application's tokens.
      description: |
        Returns the public JWK Set for application access and refresh tokens.
        Select the key whose `kid` matches the JWT JOSE header. Unknown `kid`
        values should trigger one immediate refresh before rejection. The set
        contains no private key material and at most 32 keys.
      parameters:
        - name: applicationAnchor
          in: path
          required: true
          description: Stable public application identifier carried by token `aud`.
          schema:
            type: string
      responses:
        "200":
          description: Public JWK Set for the application.
          headers:
            Cache-Control:
              $ref: "#/components/headers/PublicJwksCacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationJwksResponse"
        "400":
          description: The required application anchor path parameter is missing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Reason `ApplicationNotFound` — the application anchor is unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /refresh:
    post:
      operationId: refresh
      summary: Rotate a refresh token and issue a new access token.
      description: |
        Rotates an ordinary application refresh token and returns a new access
        token and refresh token. Replace the stored refresh token after every
        success. A near-simultaneous retry may receive the already-issued
        winning token pair. Reuse outside that allowance revokes the session;
        restart through an initial issuance flow. OIDC sessions must use the
        OIDC `/token` endpoint instead. Workload refresh tokens have the same
        actor-free wire shape; the authoritative session restores the Workload
        actor and emits a dedicated Workload access token on every rotation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: |
            New access and refresh tokens issued. A near-simultaneous retry may
            receive the token pair already issued for the same rotation.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: Reason `AccountNotFound` — the account behind the refresh token could not be resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Refresh token rejected. The `reason` distinguishes:

            - `RefreshTokenInvalid` — the token is malformed or does not match
              a valid application session.
            - `RefreshTokenInvalidType` — the token type or issuance protocol
              is not accepted here.
            - `RefreshTokenInvalidSignature` — signature verification failed.
            - `RefreshTokenSuspended` — the session is suspended.
            - `RefreshTokenExpired` — the token is past its `exp`.
            - `RefreshTokenRevoked` — the session is revoked.
            - `RefreshTokenFamilyCompromised` — a stale token version was used;
              the session is now revoked.

            Some unrecoverable rotation conflicts return an empty 401 body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The attempt was refused. The `reason` distinguishes:

            - `AccountDisabled` or `AccountDeleted` — the account is
              unavailable for issuance.
            - `ApplicationNotActive` — the application is unavailable.
            - `ClaimConsentRequired` or `RequiredClaimDataMissing` — current
              claim requirements are not satisfied.
            - `EmailDomainBlocked`, `EmailDomainRequiresSso`, or
              `SsoAuthorityConflict` — email-domain policy prevents issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Reason `AuthorizationArtifactStale`: identity authority changed
            during refresh. Restart through an initial issuance flow.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /introspect:
    post:
      operationId: introspect
      summary: Check whether the session behind an access token is still valid.
      description: |
        Returns the current effective status of the session identified by a
        signed access token. No client-auth JWT is required. The access token's
        own expiry is intentionally ignored because the response describes the
        underlying session rather than token validity. Workload tokens are
        accepted only when the session's Workload principal, generation,
        pairwise actor subject, and source credential remain authoritative.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntrospectRequest"
      responses:
        "200":
          description: Status of the session behind the access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntrospectResponse"
        "401":
          description: Access token missing, malformed, or with an invalid signature.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /userinfo:
    get:
      operationId: userinfo
      summary: Resolve current identity data shared with an application.
      description: |
        Accepts an ordinary application access token as a Bearer credential and
        returns current, consent-gated identity data for its live session. This
        endpoint accepts only sessions whose issuance
        protocol is `APPLICATION`; OIDC clients use the discovered OIDC
        `userinfo_endpoint` instead. Profile data is read live and is never
        copied from the access token.
      security:
        - BearerAccessToken: []
      responses:
        "200":
          description: Current application-visible identity data.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
            Vary:
              description: Prevent shared-cache reuse across Bearer credentials.
              schema:
                type: string
                enum: [Authorization]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfoResponse"
        "401":
          description: Bearer token missing, malformed, expired, inactive, or owned by another issuance protocol.
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BearerError"
  /claim-state:
    get:
      operationId: claimState
      summary: Resolve current identity-claim policy and consent state.
      description: |
        Accepts an ordinary application access token as a Bearer credential and
        returns the live policy requirement and standing consent state for each
        shareable UserInfo claim. This endpoint accepts only sessions whose
        issuance protocol is `APPLICATION`; OIDC clients use the custom
        `claim_state_endpoint` from OIDC discovery instead.
      security:
        - BearerAccessToken: []
      responses:
        "200":
          description: Current application-visible claim state.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
            Vary:
              description: Prevent shared-cache reuse across Bearer credentials.
              schema:
                type: string
                enum: [Authorization]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimStateResponse"
        "401":
          description: Bearer token missing, malformed, expired, inactive, or owned by another issuance protocol.
          headers:
            WWW-Authenticate:
              description: Bearer authentication challenge.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BearerError"
  /logout:
    post:
      operationId: logout
      summary: Revoke the session behind a refresh token.
      description: |
        Revokes the single session identified by the supplied refresh token.
        Any genuine signed version whose `sid`, `aud`, `jti`, and
        `rotationVersion` bind to that session may authorize the revocation;
        accepting an older genuine version here does not make it refreshable.
        No client-auth JWT is required. The operation is idempotent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Revocation outcome.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /revoke-all:
    post:
      operationId: revokeAll
      summary: Revoke every session of an account for the calling application.
      description: |
        Revokes all sessions for the supplied application-visible subject under
        the calling application. Sessions under other applications are not
        affected. The request requires a client-auth JWT with audience
        `sudomimus-session`. Unknown and out-of-scope subjects return the same
        `revoked: true` acknowledgement. Each signed request is single-use; a
        transport retry requires a freshly signed JWT with a new `jti`.
      security:
        - SudomimusClientJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAllRequest"
      responses:
        "200":
          description: Authority-safe revocation acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevokeAllResponse"
        "401":
          description: |
            Client-auth JWT missing, malformed, expired, invalid, or replayed.
            A retry after an uncertain response must use a freshly signed JWT
            with a new `jti`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    PublicJwksCacheControl:
      description: Public cache lifetime bounded by the signing-key prepublication window.
      schema:
        type: string
        pattern: ^public, max-age=[0-9]+$
    CredentialCacheControl:
      description: Prevent storage of the credential-bearing response.
      schema:
        type: string
        enum: [no-store]
    CredentialPragma:
      description: Legacy cache instruction retained for credential responses.
      schema:
        type: string
        enum: [no-cache]
  securitySchemes:
    BearerAccessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ordinary Sudomimus application access token.
    SudomimusClientJWT:
      type: http
      scheme: SudomimusClientJWT
      description: |
        Client-auth JWT carried via `Authorization: SudomimusClientJWT <jwt>`.
        For Session API `/revoke-all`, the `aud` claim MUST be the literal
        string `"sudomimus-session"`. The JWT is RS256-signed with the
        application's client-auth private key and carries `iss`, `iat`, `exp`,
        `jti`, and `body_sha256` exactly like Connect `/establish`. Each `jti`
        is accepted only once for `/revoke-all`.
  schemas:
    ApplicationJsonWebKey:
      type: object
      additionalProperties: false
      required: [kty, n, e, kid, use, alg]
      properties:
        kty:
          type: string
          enum: [RSA]
        n:
          type: string
          description: Base64url-encoded RSA modulus.
        e:
          type: string
          description: Base64url-encoded RSA public exponent.
        kid:
          type: string
          description: Stable signing-key identifier copied into JWT JOSE headers.
        use:
          type: string
          enum: [sig]
        alg:
          type: string
          enum: [RS256]
    ApplicationJwksResponse:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          maxItems: 32
          items:
            $ref: "#/components/schemas/ApplicationJsonWebKey"
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          enum: [ok]
          description: The API invocation path completed successfully.
        service:
          type: string
          description: Stable runtime service identity.
        version:
          type: string
          description: Version from the deployed service's version manifest.
    ClaimRequirementStateView:
      type: object
      required: [requirement, state]
      properties:
        requirement:
          type: string
          enum: [SYNTHETIC_ONLY, OFF, OPTIONAL, REQUIRED, SYNTHETIC_FALLBACK]
        state:
          type: string
          enum: [UNKNOWN, GRANTED, DENIED]
    ClaimsStateView:
      type: object
      required: [email, firstName, lastName, staticAvatar, animatedAvatar]
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        firstName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        lastName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        staticAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        animatedAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Signed refresh credential carrying stable payload `sid`, exact version `jti`, and `rotationVersion`; it contains no user identifier.
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken, claims]
      properties:
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        accessToken:
          type: string
          description: |
            Newly issued short-lived access token JWT carrying payload `sid`
            and owner Account pairwise `sub` with a fresh `jti`. A
            Workload-descended session uses media type
            `vnd.sudomimus.workload-access+jwt` and adds exact pairwise
            `act: {sub}`; an Account session uses
            `vnd.sudomimus.application-access+jwt` and has no `act`.
        refreshToken:
          type: string
          description: Newly issued refresh token JWT for the same payload `sid`, with a fresh `jti` and incremented `rotationVersion`; the presented version has been consumed.
    IntrospectRequest:
      type: object
      additionalProperties: false
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Signed Account or Workload access credential identifying the session to inspect; its own `exp` is intentionally ignored.
    UserInfoResponse:
      type: object
      additionalProperties: false
      required: [sub]
      properties:
        sub:
          type: string
          minLength: 1
          description: Pairwise sector subject for this application.
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        name:
          type: string
        given_name:
          type: string
        family_name:
          type: string
          description: The approved surname. Empty when the account legitimately has no surname.
        picture:
          type: string
          format: uri
        picture_animated:
          type: string
          format: uri
          description: Sudomimus private claim for the sector-scoped animated avatar URL.
    UserInfoClaimStateView:
      type: object
      additionalProperties: false
      required: [email, given_name, family_name, picture, picture_animated]
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        given_name:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        family_name:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        picture:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        picture_animated:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    ClaimStateResponse:
      type: object
      additionalProperties: false
      required: [sub, claims]
      properties:
        sub:
          type: string
          minLength: 1
          description: Pairwise sector subject for this application.
        claims:
          $ref: "#/components/schemas/UserInfoClaimStateView"
    BearerError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_token]
    IntrospectResponse:
      type: object
      required: [status, recommendedRecheckSeconds]
      properties:
        status:
          type: string
          enum: [active, revoked, expired, not_found]
        recommendedRecheckSeconds:
          type: integer
    LogoutRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Any genuine signed refresh-token version for the session to revoke.
    LogoutResponse:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: boolean
    RevokeAllRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          description: Application-visible owner Account sector subject (`sub`). Revocation advances the shared Account/Application authority and ends both human and Workload-descended sessions for that subject.
    RevokeAllResponse:
      type: object
      additionalProperties: false
      required: [revoked]
      properties:
        revoked:
          type: boolean
          enum: [true]
          description: Authority-safe acknowledgement of the revocation request.
    Error:
      type: object
      description: |
        Error response body. A missing, malformed, or structurally invalid JSON
        request body returns `InvalidBody`. Documented status-only failures have
        an empty response body.
      required: [reason]
      properties:
        reason:
          type: string
        message:
          type: string

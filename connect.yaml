openapi: 3.1.0
info:
  title: Sudomimus Connect
  version: 4.1.0
  summary: Token exchange API for the Sudomimus authentication platform.
  description: |
    The Connect API is the public entry point for integrating applications.
    Clients use it to establish an authentication inquiry, poll its status,
    redeem the realized inquiry for application tokens, and fetch localized
    application metadata.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://connect-api.sudomimus.com
    description: Production
# Default: no HTTP-level auth. Endpoints other than /establish carry their
# credentials (inquiry / refresh tokens) in the request body. /establish
# overrides this with the SudomimusClientJWT scheme.
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Report Connect invocation health and deployment identity.
      responses:
        "200":
          description: |
            The API invocation path is operational and reports the deployed
            service identity. This response does not assert dependency,
            configuration, or business-capability readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /establish:
    post:
      operationId: establish
      summary: Establish a new authentication inquiry for an application.
      description: |
        Creates an authentication inquiry for the calling application. The
        client-auth JWT binds the exact request bytes and is single-use; see
        `SudomimusClientJWT` for its claim contract.

        Constraint and return-method arrays are optional. When supplied, they
        narrow the application's configured rules and MUST be non-empty. The
        schemas define per-field limits; the three arrays together are limited
        to 65,536 serialized UTF-8 bytes.
      security:
        - SudomimusClientJWT: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstablishRequest"
      responses:
        "200":
          description: Inquiry established.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EstablishResponse"
        "401":
          description: Client-auth JWT missing, malformed, expired, or invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            Application is not ACTIVE, or its parent Sector or Organization is
            unavailable.
            Reason `ApplicationNotActive`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /status-poll:
    post:
      operationId: statusPoll
      summary: Poll the realization status of an authentication inquiry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusPollRequest"
      responses:
        "200":
          description: Current status of the inquiry.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusPollResponse"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /redeem:
    post:
      operationId: redeem
      summary: Redeem a realized inquiry for an application token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemRequest"
      responses:
        "200":
          description: Tokens issued.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedeemResponse"
        "400":
          description: |
            The inquiry could not be redeemed. The `reason` distinguishes:

            - `InquiryNotFound` — the supplied key triple is not valid.
            - `InquiryExpired` — the inquiry has expired.
            - `InquiryNotRealized` — authentication is not complete.
            - `InquiryAlreadyRedeemed` — the single-use inquiry was consumed.
            - `ApplicationNotFound`, `AuthenticationNotFound`, or
              `AccountNotFound` — required issuance authority is unavailable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The attempt was refused. The `reason` distinguishes:

            - `ApplicationNotActive` — the application is unavailable.
            - `AccountDisabled` — the realizing account is disabled.
            - `AccountDeleted` — the realizing account has been erased.
            - `ClaimConsentRequired` — interactive login is required to
              establish the current claim grant.
            - `RequiredClaimDataMissing` — a REQUIRED claim cannot currently
              be disclosed. An approved account without a surname is not
              missing data and discloses an empty surname.
            - `EmailDomainBlocked`, `EmailDomainRequiresSso`, or
              `SsoAuthorityConflict` — current email-domain policy prevents
              issuance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Reason `AuthorizationArtifactStale`: identity authority changed
            after authentication. Start a new inquiry before retrying.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /info:
    post:
      operationId: info
      summary: Fetch localized public metadata about an application.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfoRequest"
      responses:
        "200":
          description: Application metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    CredentialCacheControl:
      description: Prevent storage of the credential-bearing response.
      schema:
        type: string
        enum: [no-store]
    CredentialPragma:
      description: Legacy cache instruction retained for credential responses.
      schema:
        type: string
        enum: [no-cache]
  securitySchemes:
    SudomimusClientJWT:
      type: http
      scheme: SudomimusClientJWT
      description: |
        Client-auth JWT carried via `Authorization: SudomimusClientJWT <jwt>`.

        The JWT MUST be signed with RS256 using the application's client-auth
        private key. Required claims:

        - `iss`: the application anchor (must match `applicationAnchor` in
          the request body).
        - `aud`: literal string `"sudomimus-connect"`.
        - `iat`: UNIX seconds. Future-dated claims are tolerated up to a
          30-second clock skew.
        - `exp`: UNIX seconds. Lifetime (`exp - iat`) MUST be at most 60.
        - `jti`: per-request unique identifier (UUID v4 recommended). A `jti`
          is accepted only once.
        - `body_sha256`: standard base64 of `SHA-256(rawHttpBody)` where the
          input is the UTF-8 bytes of the exact JSON body sent on the wire.
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum: [ok]
          description: The API invocation path completed successfully.
        service:
          type: string
          description: Stable runtime service identity.
        version:
          type: string
          description: Version from the deployed service's version manifest.
    EstablishRequest:
      type: object
      additionalProperties: false
      required:
        - applicationAnchor
      properties:
        applicationAnchor:
          type: string
          description: Public anchor identifying the integrating application.
        authenticationConstraints:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            Optional per-inquiry narrowing of the application's
            authentication-rule layer. Absent means no narrowing. If present,
            the array MUST be non-empty; empty arrays are rejected with 400.
          items:
            $ref: "#/components/schemas/AuthenticationRuleConstraint"
        realizeConstraints:
          type: array
          minItems: 1
          maxItems: 16
          description: |
            Optional per-inquiry narrowing of the application's realize-rule
            layer. Absent means no narrowing. If present, the array MUST be
            non-empty; empty arrays are rejected with 400.
          items:
            $ref: "#/components/schemas/RealizeRuleConstraint"
        returnMethods:
          type: array
          minItems: 1
          maxItems: 3
          description: |
            Optional return methods for this inquiry. Connect accepts CALLBACK,
            STATUS_POLL, and REVEAL. CALLBACK includes its concrete delivery
            URL. Absence means no per-inquiry narrowing, but CALLBACK is not
            available without a URL. If supplied, the array MUST be non-empty.
          items:
            $ref: "#/components/schemas/ReturnMethodDeclaration"
    EstablishResponse:
      type: object
      required:
        - applicationAnchor
        - exposureKey
        - hiddenKey
      properties:
        applicationAnchor:
          type: string
        exposureKey:
          type: string
          description: Public half of the inquiry key pair; safe to share with the user agent.
        hiddenKey:
          type: string
          description: Private half of the inquiry key pair; must stay on the originating client.
    StatusPollRequest:
      type: object
      additionalProperties: false
      required:
        - exposureKey
        - hiddenKey
      properties:
        exposureKey:
          type: string
        hiddenKey:
          type: string
    StatusPollResponse:
      oneOf:
        - $ref: "#/components/schemas/StatusPollPendingResponse"
        - $ref: "#/components/schemas/StatusPollRealizedResponse"
      discriminator:
        propertyName: status
        mapping:
          PENDING: "#/components/schemas/StatusPollPendingResponse"
          REALIZED: "#/components/schemas/StatusPollRealizedResponse"
    StatusPollPendingResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PENDING
    StatusPollRealizedResponse:
      type: object
      required:
        - status
        - confirmationKey
      properties:
        status:
          type: string
          enum:
            - REALIZED
        confirmationKey:
          type: string
          description: One-time key proving the inquiry has been realized; pass to /redeem.
    RedeemRequest:
      type: object
      additionalProperties: false
      required:
        - exposureKey
        - hiddenKey
        - confirmationKey
      properties:
        exposureKey:
          type: string
        hiddenKey:
          type: string
        confirmationKey:
          type: string
    ClaimRequirementStateView:
      type: object
      description: |
        One shareable claim: what the application requests (`requirement`)
        joined with the user's standing decision (`state`). `UNKNOWN` means
        the user was never asked; `DENIED` means the user explicitly
        declined.
      required:
        - requirement
        - state
      properties:
        requirement:
          type: string
          description: |
            The developer's policy for the claim. `SYNTHETIC_ONLY` always
            emits the generated placeholder and never asks for real data.
            `SYNTHETIC_FALLBACK` guarantees the claim is present but uses a
            generated placeholder (a stand-in name, a proxy email, or a
            generated avatar) when the user has not shared real data. Unlike `REQUIRED`, neither
            synthetic mode blocks issuance or raises an errand.
          enum: [SYNTHETIC_ONLY, OFF, OPTIONAL, REQUIRED, SYNTHETIC_FALLBACK]
        state:
          type: string
          enum: [UNKNOWN, GRANTED, DENIED]
    ClaimsStateView:
      type: object
      description: |
        Per-claim view across the five shareable claims — why a claim is
        or is not present in the minted token (policy OFF, never asked,
        declined, or granted).
      required:
        - email
        - firstName
        - lastName
        - staticAvatar
        - animatedAvatar
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        firstName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        lastName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        staticAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        animatedAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    RedeemResponse:
      type: object
      required:
        - applicationAnchor
        - refreshToken
        - accessToken
        - claims
      properties:
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
        applicationAnchor:
          type: string
        refreshToken:
          type: string
          description: |
            Long-lived refresh token (JWT). Decode its protected header as
            `RefreshTokenHeader` and its body as `RefreshTokenBody`. The
            payload binds the logical session as `sid`, names the rotating
            bearer instance as `jti`, and carries a positive
            `rotationVersion`. It carries no user identifier or profile data.
        accessToken:
          type: string
          description: |
            Short-lived access token (JWT). Decode its protected header as
            `AccessTokenHeader` and its body as `AccessTokenBody`. The
            payload carries the application-visible user key as `sub`, the
            logical session as `sid`, and this access-token instance as `jti`.
            Fetch current shared profile data from Session API `/userinfo`.
    AccessTokenHeader:
      type: object
      additionalProperties: false
      description: |
        Exact JOSE protected header of a Sudomimus application access token.
        Registered JWT claims live in the payload.
      required: [alg, kid, typ]
      properties:
        alg:
          type: string
          enum: [RS256]
        kid:
          type: string
          minLength: 1
          description: Application token-signing key identifier.
        typ:
          type: string
          enum: [vnd.sudomimus.application-access+jwt]
    AccessTokenBody:
      type: object
      additionalProperties: false
      description: |
        Minimal payload of a Sudomimus access token. It contains only
        registered JWT claims and session binding. It never contains a raw
        account identifier or profile claims; use Session API `/userinfo` for
        current consent-gated identity data.
      required: [iss, aud, sub, sid, jti, iat, exp]
      properties:
        iss:
          type: string
          format: uri
          minLength: 1
        aud:
          type: string
          minLength: 1
          description: Public application anchor.
        sub:
          type: string
          minLength: 1
          description: Pairwise sector subject; use this opaque value as the application-visible user key.
        sid:
          type: string
          minLength: 1
          description: Stable identifier of the logical ApplicationSession.
        jti:
          type: string
          minLength: 1
          description: Unique identifier of this access-token instance; distinct from `sid`.
        iat:
          type: integer
          minimum: 0
        exp:
          type: integer
          minimum: 1
    RefreshTokenHeader:
      type: object
      additionalProperties: false
      description: |
        Exact JOSE protected header of a Sudomimus refresh token. Registered
        JWT claims and rotation state live in the payload.
      required: [alg, kid, typ]
      properties:
        alg:
          type: string
          enum: [RS256]
        kid:
          type: string
          minLength: 1
          description: Application token-signing key identifier.
        typ:
          type: string
          enum: [vnd.sudomimus.application-refresh+jwt]
    RefreshTokenBody:
      type: object
      additionalProperties: false
      description: |
        Minimal payload of a Sudomimus refresh token. `sid` stays stable across
        rotation, while every signed version has a distinct `jti` and positive
        `rotationVersion`. The payload contains no user identifier, profile
        claim, or raw account identifier.
      required: [iss, aud, sid, jti, iat, exp, rotationVersion]
      properties:
        iss:
          type: string
          format: uri
          minLength: 1
        aud:
          type: string
          minLength: 1
          description: Public application anchor.
        sid:
          type: string
          minLength: 1
          description: Stable identifier of the logical ApplicationSession.
        jti:
          type: string
          minLength: 1
          description: Identifier of this exact rotating refresh-token version.
        iat:
          type: integer
          minimum: 0
        exp:
          type: integer
          minimum: 1
        rotationVersion:
          type: integer
          minimum: 1
          description: |
            Monotonic refresh version within `sid`. A successful rotation
            increments it by one; callers must store the newly returned token.
    InfoRequest:
      type: object
      additionalProperties: false
      required:
        - applicationAnchor
        - locale
      properties:
        applicationAnchor:
          type: string
        locale:
          type: string
          description: IETF BCP 47 locale tag (e.g. "en-US"). Falls back to the application's default locale if not available.
    InfoResponse:
      type: object
      required:
        - applicationAnchor
        - applicationName
      properties:
        applicationAnchor:
          type: string
        applicationName:
          type: string
          description: Localized application display name.
    AuthenticationRuleConstraint:
      oneOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintPasskeyUsernameless"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintPasskeyReasoned"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintEmailVerification"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintSteamTicket"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintSteamOpenId"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintAccessKeyDirect"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintGoogleOAuth"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintGitHubOAuth"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintDiscordOAuth"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintBattleNetOAuth"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintXOAuth"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintEnterpriseFederationApplicationManaged"
        - $ref: "#/components/schemas/AuthenticationRuleConstraintEnterpriseFederationDomainManaged"
      discriminator:
        propertyName: method
        mapping:
          PASSKEY_USERNAMELESS: "#/components/schemas/AuthenticationRuleConstraintPasskeyUsernameless"
          PASSKEY_REASONED: "#/components/schemas/AuthenticationRuleConstraintPasskeyReasoned"
          EMAIL_VERIFICATION: "#/components/schemas/AuthenticationRuleConstraintEmailVerification"
          STEAM_TICKET: "#/components/schemas/AuthenticationRuleConstraintSteamTicket"
          STEAM_OPENID: "#/components/schemas/AuthenticationRuleConstraintSteamOpenId"
          ACCESS_KEY_DIRECT: "#/components/schemas/AuthenticationRuleConstraintAccessKeyDirect"
          GOOGLE_OAUTH: "#/components/schemas/AuthenticationRuleConstraintGoogleOAuth"
          GITHUB_OAUTH: "#/components/schemas/AuthenticationRuleConstraintGitHubOAuth"
          DISCORD_OAUTH: "#/components/schemas/AuthenticationRuleConstraintDiscordOAuth"
          BATTLENET_OAUTH: "#/components/schemas/AuthenticationRuleConstraintBattleNetOAuth"
          X_OAUTH: "#/components/schemas/AuthenticationRuleConstraintXOAuth"
          ENTERPRISE_FEDERATION_APPLICATION_MANAGED: "#/components/schemas/AuthenticationRuleConstraintEnterpriseFederationApplicationManaged"
          ENTERPRISE_FEDERATION_DOMAIN_MANAGED: "#/components/schemas/AuthenticationRuleConstraintEnterpriseFederationDomainManaged"
    AuthenticationRuleConstraintCommon:
      type: object
      properties:
        accessTokenTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: Per-constraint override for access token lifetime. Resolved at realize time.
        refreshTokenTtlSeconds:
          type: integer
          minimum: 86400
          maximum: 31536000
          description: Per-constraint override for refresh token lifetime. Resolved at realize time.
    AuthenticationRuleConstraintPasskeyUsernameless:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [PASSKEY_USERNAMELESS]
            payload:
              $ref: "#/components/schemas/AuthenticationRulePasskeyUsernamelessPayload"
    AuthenticationRuleConstraintPasskeyReasoned:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [PASSKEY_REASONED]
            payload:
              $ref: "#/components/schemas/AuthenticationRulePasskeyReasonedPayload"
    AuthenticationRuleConstraintEmailVerification:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [EMAIL_VERIFICATION]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleEmailVerificationPayload"
    AuthenticationRuleConstraintSteamTicket:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [STEAM_TICKET]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleSteamTicketPayload"
    AuthenticationRuleConstraintSteamOpenId:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [STEAM_OPENID]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleSteamOpenIdPayload"
    AuthenticationRuleConstraintAccessKeyDirect:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [ACCESS_KEY_DIRECT]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleAccessKeyDirectPayload"
    AuthenticationRuleConstraintGoogleOAuth:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [GOOGLE_OAUTH]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleGoogleOAuthPayload"
    AuthenticationRuleConstraintGitHubOAuth:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [GITHUB_OAUTH]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleGitHubOAuthPayload"
    AuthenticationRuleConstraintDiscordOAuth:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [DISCORD_OAUTH]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleDiscordOAuthPayload"
    AuthenticationRuleConstraintBattleNetOAuth:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [BATTLENET_OAUTH]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleBattleNetOAuthPayload"
    AuthenticationRuleConstraintXOAuth:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [X_OAUTH]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleXOAuthPayload"
    AuthenticationRuleConstraintEnterpriseFederationApplicationManaged:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [ENTERPRISE_FEDERATION_APPLICATION_MANAGED]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleEnterpriseFederationApplicationManagedPayload"
    AuthenticationRuleConstraintEnterpriseFederationDomainManaged:
      allOf:
        - $ref: "#/components/schemas/AuthenticationRuleConstraintCommon"
        - type: object
          required: [method, payload]
          properties:
            method:
              type: string
              enum: [ENTERPRISE_FEDERATION_DOMAIN_MANAGED]
            payload:
              $ref: "#/components/schemas/AuthenticationRuleEnterpriseFederationDomainManagedPayload"
    AuthenticationRulePasskeyUsernamelessPayload:
      type: object
      description: |
        Empty payload — narrows to usernameless (discoverable-credential)
        passkey login shown before an email is entered. Other configured
        authorization rules still apply.
      additionalProperties: false
    AuthenticationRulePasskeyReasonedPayload:
      type: object
      description: |
        Empty payload — narrows to email-first ("reasoned") passkey login,
        the passkey option offered after the user enters an email. Other
        configured authorization rules still apply.
      additionalProperties: false
    AuthenticationRuleEmailVerificationPayload:
      type: object
      description: Empty payload — email-verification constraints carry no further parameters.
      additionalProperties: false
    AuthenticationRuleSteamTicketPayload:
      type: object
      description: |
        Steam-native-ticket payload. Gates native-api's
        `/direct-issue/steam-ticket` flow. `allowedSteamAppIds` is the
        non-empty list of Steam App IDs whose tickets are accepted.
      required:
        - allowedSteamAppIds
      additionalProperties: false
      properties:
        allowedSteamAppIds:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: integer
            format: int64
            minimum: 1
    AuthenticationRuleSteamOpenIdPayload:
      type: object
      description: |
        Steam OpenID 2.0 carries no app-id concept (that is
        native-ticket-specific). Any Steam account is accepted as long
        as the application's rule set allows STEAM_OPENID at all.
      additionalProperties: false
    AuthenticationRuleAccessKeyDirectPayload:
      type: object
      description: |
        Enables Native API `/direct-issue/access-key` authentication.
      additionalProperties: false
    AuthenticationRuleGoogleOAuthPayload:
      type: object
      description: |
        Empty `allowedHostedDomains` means no hosted-domain gating. A
        non-empty list requires an exact, case-insensitive match against the
        Google Workspace `hd` claim. Matching is case-insensitive.
      additionalProperties: false
      properties:
        allowedHostedDomains:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
    AuthenticationRuleGitHubOAuthPayload:
      type: object
      description: |
        Empty `allowedGitHubOrgs` array means no org gating — any
        GitHub account is accepted. Non-empty means the user must be a
        member of at least one listed organization (case-insensitive
        match on the org `login`). The `read:org` OAuth scope is only
        requested when at least one matching rule carries a non-empty
        allowlist; applications without org gating keep the minimal
        `read:user user:email` consent screen.
      required:
        - allowedGitHubOrgs
      additionalProperties: false
      properties:
        allowedGitHubOrgs:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
    AuthenticationRuleDiscordOAuthPayload:
      type: object
      description: |
        Empty `allowedDiscordGuilds` means no guild gating. A non-empty list
        requires membership in at least one listed Discord guild and causes
        the authentication flow to request the `guilds` scope.
      additionalProperties: false
      properties:
        allowedDiscordGuilds:
          type: array
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 2048
    AuthenticationRuleBattleNetOAuthPayload:
      type: object
      description: |
        Battle.net (Blizzard) has no per-application gating concept, so any
        Battle.net account is accepted as long as the application's rule set
        allows BATTLENET_OAUTH at all. Empty payload. Battle.net is an
        email-less provider, so Layer-2 EMAIL rules fail closed against a
        Battle.net-only account.
      additionalProperties: false
    AuthenticationRuleXOAuthPayload:
      type: object
      description: |
        X (formerly Twitter) has no per-application gating concept, so any
        X account is accepted as long as the application's rule set allows
        X_OAUTH at all. Empty payload. X is an email-less provider, so
        Layer-2 EMAIL rules fail closed against an X-only account.
      additionalProperties: false
    AuthenticationRuleEnterpriseFederationApplicationManagedPayload:
      type: object
      description: |
        Application-managed enterprise federation. `connectorAnchor` names an
        enabled FederationConnector owned by the application's organization.
      required:
        - connectorAnchor
      additionalProperties: false
      properties:
        connectorAnchor:
          type: string
          minLength: 1
          pattern: "\\S"
          maxLength: 2048
    AuthenticationRuleEnterpriseFederationDomainManagedPayload:
      type: object
      description: |
        Empty payload — the connector is selected from the verified adopted
        domain's SSO_ONLY policy rather than by the application.
      additionalProperties: false
    RealizeRuleConstraint:
      oneOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintEmail"
        - $ref: "#/components/schemas/RealizeRuleConstraintSteamId"
        - $ref: "#/components/schemas/RealizeRuleConstraintAccountAlias"
        - $ref: "#/components/schemas/RealizeRuleConstraintSectorSubject"
        - $ref: "#/components/schemas/RealizeRuleConstraintEveryone"
      discriminator:
        propertyName: constraintType
        mapping:
          EMAIL: "#/components/schemas/RealizeRuleConstraintEmail"
          STEAM_ID: "#/components/schemas/RealizeRuleConstraintSteamId"
          ACCOUNT_ALIAS: "#/components/schemas/RealizeRuleConstraintAccountAlias"
          SECTOR_SUBJECT: "#/components/schemas/RealizeRuleConstraintSectorSubject"
          EVERYONE: "#/components/schemas/RealizeRuleConstraintEveryone"
    RealizeRuleConstraintCommon:
      type: object
      properties:
        accessTokenTtlSeconds:
          type: integer
          minimum: 60
          maximum: 604800
          description: Per-constraint override for access token lifetime. Resolved at realize time.
        refreshTokenTtlSeconds:
          type: integer
          minimum: 86400
          maximum: 31536000
          description: Per-constraint override for refresh token lifetime. Resolved at realize time.
    RealizeRuleConstraintEmail:
      allOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintCommon"
        - type: object
          required: [constraintType, payload]
          properties:
            constraintType:
              type: string
              enum: [EMAIL]
            payload:
              $ref: "#/components/schemas/RealizeRuleEmailPayload"
    RealizeRuleConstraintSteamId:
      allOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintCommon"
        - type: object
          required: [constraintType, payload]
          properties:
            constraintType:
              type: string
              enum: [STEAM_ID]
            payload:
              $ref: "#/components/schemas/RealizeRuleSteamIdPayload"
    RealizeRuleConstraintAccountAlias:
      allOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintCommon"
        - type: object
          required: [constraintType, payload]
          properties:
            constraintType:
              type: string
              enum: [ACCOUNT_ALIAS]
            payload:
              $ref: "#/components/schemas/RealizeRuleAccountAliasPayload"
    RealizeRuleConstraintSectorSubject:
      allOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintCommon"
        - type: object
          required: [constraintType, payload]
          properties:
            constraintType:
              type: string
              enum: [SECTOR_SUBJECT]
            payload:
              $ref: "#/components/schemas/RealizeRuleSectorSubjectPayload"
    RealizeRuleConstraintEveryone:
      allOf:
        - $ref: "#/components/schemas/RealizeRuleConstraintCommon"
        - type: object
          required: [constraintType, payload]
          properties:
            constraintType:
              type: string
              enum: [EVERYONE]
            payload:
              $ref: "#/components/schemas/RealizeRuleEveryonePayload"
    RealizeRuleEmailPayload:
      type: object
      required:
        - allowedEmails
      properties:
        allowedEmails:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          description: |
            List of email addresses or glob patterns the realized identity
            must match.
          items:
            type: string
            maxLength: 254
    RealizeRuleSteamIdPayload:
      type: object
      description: |
        Per-realize-time check against the realized account's SteamID64.
        Each entry is either the literal `"*"` (wildcard, allow any
        Steam identity) or a decimal SteamID64 string.
      required:
        - allowedSteamIds
      properties:
        allowedSteamIds:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: "^(\\*|[0-9]{1,20})$"
    RealizeRuleAccountAliasPayload:
      type: object
      description: |
        Exact match on the account alias shared by the user. Wildcards are not
        supported, and a new account cannot match a pre-existing alias list.
        Values are opaque and compared exactly.
      required:
        - allowedAccountAliases
      properties:
        allowedAccountAliases:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    RealizeRuleSectorSubjectPayload:
      type: object
      description: |
        Exact match on the application-visible token `sub`. Wildcards are not
        supported. A rotated subject must be allow-listed separately. Values
        are opaque and compared exactly.
      required:
        - allowedSectorSubjects
      properties:
        allowedSectorSubjects:
          type: array
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
    RealizeRuleEveryonePayload:
      type: object
      description: |
        Empty payload — the explicit EVERYONE constraint admits any realized
        identity on this side of the Layer-2 AND boundary.
      additionalProperties: false
    ReturnMethodDeclaration:
      oneOf:
        - $ref: "#/components/schemas/ReturnMethodCallback"
        - $ref: "#/components/schemas/ReturnMethodStatusPoll"
        - $ref: "#/components/schemas/ReturnMethodReveal"
      discriminator:
        propertyName: type
        mapping:
          CALLBACK: "#/components/schemas/ReturnMethodCallback"
          STATUS_POLL: "#/components/schemas/ReturnMethodStatusPoll"
          REVEAL: "#/components/schemas/ReturnMethodReveal"
    ReturnMethodCallback:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - CALLBACK
        payload:
          type: object
          required:
            - callbackUrl
          properties:
            callbackUrl:
              type: string
              maxLength: 2048
              description: |
                Concrete callback URL for this inquiry. The host MUST match
                one of the application's allowed callback domains. The scheme
                MUST be HTTPS except loopback HTTP for local development
                (`localhost`, `127.0.0.1`, `[::1]`). After realization,
                Connect appends the canonical `exposure-key` and
                `confirmation-key` query parameters. Existing query parameters
                and fragments are preserved; caller-supplied or duplicate
                values for the two canonical names are overwritten. The URL
                MUST be concrete and MUST NOT contain Inquiry-key templates.
                Length is measured in UTF-8 bytes.
    ReturnMethodStatusPoll:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - STATUS_POLL
        payload:
          type: object
          description: Empty payload — STATUS_POLL carries no per-inquiry parameters.
          additionalProperties: false
    ReturnMethodReveal:
      type: object
      required:
        - type
        - payload
      properties:
        type:
          type: string
          enum:
            - REVEAL
        payload:
          type: object
          description: |
            Empty payload. Tokens are surfaced directly in the UI at
            realize time and the inquiry is marked redeemed immediately;
            any subsequent `/redeem` for the same inquiry fails with
            `InquiryAlreadyRedeemed`.
          additionalProperties: false
    Error:
      type: object
      description: |
        Error response body. Known failures may include a stable `reason`.
        Some failures are status-only and have an empty body. A missing,
        malformed, or structurally invalid JSON body returns `InvalidBody`.
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code.

openapi: 3.1.0
info:
  title: Sudomimus Device
  version: 4.1.0
  summary: Device authorization API for public clients.
  description: |
    Public clients use the Device API to obtain a device code, send the user to
    browser approval, and poll for ordinary Sudomimus application tokens. No
    client secret is required. After issuance, use the Session API to refresh,
    inspect, or revoke the resulting session.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://device-api.sudomimus.com
    description: Production
# No HTTP-level authentication. The high-entropy deviceCode authorizes polling.
security: []
paths:
  /health:
    get:
      operationId: health
      summary: Report Device invocation health and deployment identity.
      responses:
        "200":
          description: |
            The API invocation path is operational and reports the deployed
            service identity. This response does not assert dependency,
            configuration, or business-capability readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /device-authorize:
    post:
      operationId: deviceAuthorize
      summary: Start a device authorization session.
      description: |
        Creates a short-lived device authorization for `applicationAnchor`.
        No client-auth JWT is required. Keep `deviceCode` private, show
        `userCode` to the user, and direct them to either verification URI.
        Poll `/device-token` no faster than the returned `interval`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAuthorizeRequest"
      responses:
        "200":
          description: Device authorization session created.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAuthorizeResponse"
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The application cannot start device authorization. The `reason`
            distinguishes:

            - `ApplicationNotActive` - the application is unavailable.
            - `Layer3Denied` - the application does not currently have an
              enabled `DEVICE_CODE` ReturnRule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Application anchor not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many authorization requests. Retry later.
        "503":
          description: Device authorization is temporarily unavailable.
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /device-token:
    post:
      operationId: deviceToken
      summary: Poll and consume a device authorization session.
      description: |
        Polls the authorization identified by `deviceCode`. Polling states use
        OAuth-style device-flow errors. Success consumes the authorization and
        returns an access/refresh token pair; the code cannot issue tokens
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenRequest"
      responses:
        "200":
          description: Tokens issued and the device authorization session consumed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenResponse"
        "400":
          description: |
            Device-flow polling state or terminal client-visible refusal:

            - `authorization_pending` - the user has not approved or denied the
              request yet. Continue polling after the current interval.
            - `slow_down` - the client is polling too quickly. Use the returned
              `interval` value for subsequent polls.
            - `access_denied` - the user or current policy denied issuance.
            - `expired_token` - the device authorization session expired.
            - `invalid_request` - the request body is missing, malformed, or
              structurally invalid; or the `deviceCode` is unknown or has
              already been consumed.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"
        "500":
          description: |
            Token issuance failed. Stop polling and start a new device
            authorization if the user wants to retry.
          headers:
            Cache-Control:
              $ref: "#/components/headers/CredentialCacheControl"
            Pragma:
              $ref: "#/components/headers/CredentialPragma"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTokenError"
        default:
          description: Error response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  headers:
    CredentialCacheControl:
      description: Prevent storage of the token or polling response.
      schema:
        type: string
        enum: [no-store]
    CredentialPragma:
      description: Legacy cache instruction retained for token polling responses.
      schema:
        type: string
        enum: [no-cache]
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum: [ok]
          description: The API invocation path completed successfully.
        service:
          type: string
          description: Stable runtime service identity.
        version:
          type: string
          description: Version from the deployed service's version manifest.
    ApplicationAnchor:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$"
      description: |
        Public anchor identifying the application. Strict kebab-case, unique at
        application creation, and immutable after creation.
    DeviceCode:
      type: string
      pattern: "^dvc_[0-9a-f]{64}$"
      description: |
        High-entropy bearer secret for `/device-token`, returned only to the
        initiating client. Keep it private; do not display it to the browser
        user.
    UserCode:
      type: string
      pattern: "^[0-9ABCDEFGHJKMNPQRSTVWXYZ]{4}-[0-9ABCDEFGHJKMNPQRSTVWXYZ]{4}$"
      description: |
        Short human-facing code shown by the client and confirmed in the
        browser. Uses the Crockford-style alphabet without ambiguous letters.
    DeviceAuthorizeRequest:
      type: object
      required:
        - applicationAnchor
      additionalProperties: false
      properties:
        applicationAnchor:
          $ref: "#/components/schemas/ApplicationAnchor"
    DeviceAuthorizeResponse:
      type: object
      required:
        - applicationAnchor
        - deviceCode
        - userCode
        - verificationUri
        - verificationUriComplete
        - expiresIn
        - interval
      properties:
        applicationAnchor:
          $ref: "#/components/schemas/ApplicationAnchor"
        deviceCode:
          $ref: "#/components/schemas/DeviceCode"
        userCode:
          $ref: "#/components/schemas/UserCode"
        verificationUri:
          type: string
          format: uri
          description: Browser page where the user enters or confirms `userCode`.
        verificationUriComplete:
          type: string
          format: uri
          description: Browser URL pre-filled with `userCode`.
        expiresIn:
          type: integer
          minimum: 1
          description: Session lifetime in seconds. Default production value is 600.
        interval:
          type: integer
          minimum: 1
          description: Minimum polling interval in seconds. Default production value is 5.
    DeviceTokenRequest:
      type: object
      required:
        - deviceCode
      additionalProperties: false
      properties:
        deviceCode:
          $ref: "#/components/schemas/DeviceCode"
    DeviceTokenResponse:
      type: object
      required:
        - applicationAnchor
        - accessToken
        - refreshToken
        - claims
      properties:
        applicationAnchor:
          $ref: "#/components/schemas/ApplicationAnchor"
        accessToken:
          type: string
          description: |
            Short-lived access token (JWT). Payload `sub` is the pairwise
            sector subject, `sid` identifies the session, and
            `jti` identifies this access-token instance. It contains no profile
            claims or raw account identifier; use Session API `/userinfo` for
            current shared identity data.
        refreshToken:
          type: string
          description: |
            Long-lived refresh token (JWT). Payload `sid` binds the session,
            `jti` names this exact bearer version, and `rotationVersion` is a
            positive integer. It contains no user identifier. Use Session API
            `/refresh` to rotate it and issue later access tokens.
        claims:
          $ref: "#/components/schemas/ClaimsStateView"
    DeviceTokenError:
      type: object
      description: |
        OAuth-style device-flow error body returned by `/device-token`.
        Polling clients should branch on `error`, not on Sudomimus wire
        `reason` symbols.
      required:
        - error
      properties:
        error:
          type: string
          enum:
            - authorization_pending
            - slow_down
            - access_denied
            - expired_token
            - invalid_request
            - server_error
        interval:
          type: integer
          minimum: 1
          description: Present for `slow_down`; use this value for subsequent polls.
    ClaimRequirementStateView:
      type: object
      description: |
        One shareable claim: what the application requests (`requirement`)
        joined with the user's standing decision (`state`). `UNKNOWN` means the
        user was never asked; `DENIED` means the user explicitly declined.
      required:
        - requirement
        - state
      properties:
        requirement:
          type: string
          description: |
            The developer's policy for the claim. `SYNTHETIC_ONLY` always
            emits a generated placeholder and never asks for real data.
            `SYNTHETIC_FALLBACK` guarantees the claim is present but uses a
            generated placeholder when the user has not shared real data.
          enum: [SYNTHETIC_ONLY, OFF, OPTIONAL, REQUIRED, SYNTHETIC_FALLBACK]
        state:
          type: string
          enum: [UNKNOWN, GRANTED, DENIED]
    ClaimsStateView:
      type: object
      description: |
        Per-claim view across the five shareable claims - why a claim is or is
        not present in the minted token.
      required:
        - email
        - firstName
        - lastName
        - staticAvatar
        - animatedAvatar
      properties:
        email:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        firstName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        lastName:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        staticAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
        animatedAvatar:
          $ref: "#/components/schemas/ClaimRequirementStateView"
    Error:
      type: object
      description: |
        Error response body for failures outside the device polling state
        machine. `/device-token` polling states use `DeviceTokenError`.
        Invalid JSON request bodies return `InvalidBody`.
      properties:
        reason:
          type: string
          description: Stable machine-readable reason code.
